{% extends "common/layout.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 text-center">
        <h1 class="display-4 fw-bold mb-4">Secure Life Insurance Verification Portal</h1>

        <div class="mt-5">
            {% if not current_user.is_authenticated %}
            <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg px-5 me-2">Get Started</a>
            <a href="{{ url_for('signup') }}" class="btn btn-outline-primary btn-lg px-5">Join Now</a>
            {% else %}
            <a href="/{{ current_user.role }}/dashboard" class="btn btn-primary btn-lg px-5">Go to Dashboard</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
