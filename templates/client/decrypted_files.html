{% extends "common/layout.html" %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <h2 class="fw-bold mb-4">View Decrypted Documents</h2>
        <div class="row g-4">
            {% for file in files %}
            <div class="col-md-4">
                <div class="card h-100 shadow-sm border-success">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <i class="bi bi-file-earmark-check-fill h1 text-success me-3"></i>
                            <h5 class="mb-0">{{ file.filename }}</h5>
                        </div>
                        <p class="text-muted small">Access: Verified with Private Key</p>
                        <div class="d-grid mt-3">
                            <a href="/download/{{ file.doc_id }}/decrypted" class="btn btn-success">Decrypt & Download
                                PDF</a>
                        </div>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="col-12 text-center py-5">
                <p class="text-muted">No documents available for decryption.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
