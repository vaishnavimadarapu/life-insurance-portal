{% extends "common/layout.html" %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <h2 class="fw-bold mb-4">System Audit Logs</h2>

        <div class="card p-3">
            <div class="table-responsive">
                <table class="table table-sm table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Timestamp</th>
                            <th>User</th>
                            <th>Action</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for log in logs %}
                        <tr>
                            <td class="text-nowrap">{{ log.timestamp }}</td>
                            <td>{{ log.user_email }}</td>
                            <td><span class="badge bg-info text-dark">{{ log.action }}</span></td>
                            <td>{{ log.details }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
