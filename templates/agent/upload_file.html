{% extends "common/layout.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4">
            <h2 class="mb-3">Upload Secure Document</h2>
            <p class="text-muted small">Files are encrypted using the client's public key before storage.</p>
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Client</label>
                    <select name="client_email" class="form-select" required>
                        <option value="">Select Client</option>
                        {% for client in clients %}
                        <option value="{{ client.email }}">{{ client.name }} ({{ client.email }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Select File</label>
                    <input type="file" name="file" class="form-control" required>
                </div>
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Encrypt & Upload</button>
                    <a href="{{ url_for('agent_dashboard') }}" class="btn btn-light">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
