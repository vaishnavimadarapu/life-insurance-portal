{% extends "common/layout.html" %}

{% block content %}
<div class="row">
    <div class="col-md-10 mx-auto">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Messenger</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newMsgModal">+ New Message</button>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card p-3 shadow-sm h-100">
                    <h5>Recent Contacts</h5>
                    <div class="list-group list-group-flush mt-3">
                        <a href="#" class="list-group-item list-group-item-action active">Admin Support</a>
                        <a href="#" class="list-group-item list-group-item-action">Client Services</a>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card p-4 shadow-sm h-100" style="min-height: 400px;">
                    <div class="d-flex align-items-center border-bottom pb-3 mb-3">
                        <div class="bg-success rounded-circle me-3" style="width: 10px; height: 10px;"></div>
                        <h5 class="mb-0">Secure Chat</h5>
                    </div>

                    <div class="chat-box mb-4 overflow-auto" style="height: 300px;">
                        {% for msg in messages %}
                        <div class="mb-3">
                            <div class="text-muted small mb-1">{{ msg.sender }} - {{ msg.timestamp }}</div>
                            <div
                                class="p-3 {{ 'bg-primary text-white ms-5 rounded-start rounded-bottom' if msg.sender == current_user.email else 'bg-light me-5 rounded-end rounded-bottom' }}">
                                {{ msg.text }}
                            </div>
                        </div>
                        {% endfor %}
                    </div>

                    <form action="{{ url_for('send_message') }}" method="POST">
                        <div class="input-group">
                            <input type="hidden" name="recipient_email" value="admin@example.com">
                            <input type="text" name="message" class="form-control"
                                placeholder="Type encrypted message...">
                            <button class="btn btn-primary">Send</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Simple Modal for New Message -->
<div class="modal fade" id="newMsgModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">New Secure Message</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form action="{{ url_for('send_message') }}" method="POST">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Recipient Email</label>
                        <input type="email" name="recipient_email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea name="message" class="form-control" rows="4"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Send Encrypted</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
